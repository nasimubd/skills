# Lychee link-checker configuration.
#
# THIS IS THE ONLY LYCHEE CONFIG IN THE REPOSITORY, AND IT MUST STAY THAT WAY.
#
# Consumer: `lychee .` run from the repository root. Lychee auto-discovers a
# file named exactly `lychee.toml` in the working directory; nothing passes
# `--config`, so the filename IS the wiring.
#
# Do not add `.lychee.toml`. Two config files is not redundancy — lychee reads
# one of them and silently ignores the other, so every exclusion added to the
# wrong file appears to work (the link check still passes) while actually doing
# nothing. Whichever file is being ignored then drifts, and there is no way to
# tell from a green run which set of rules was in force. If a rule needs to
# change, change it here.

############################# Display ###############################
verbose = "error"      # Only surface failures
no_progress = true     # Required for non-interactive shells

############################# Cache #################################
cache = true
max_cache_age = "7d"

############################# Runtime ###############################
timeout = 10
max_retries = 2
max_concurrency = 8

############################# Features ##############################
include_fragments = true
include_verbatim = false
include_mail = false

############################# Path Exclusions #######################
# Regex patterns (NOT globs) for files to skip entirely.
exclude_path = [
    "node_modules/",
    "\\.git/",
    "\\.venv/",
    "__pycache__/",
    "tmp/",
    # Generated by @semantic-release/changelog from the commit range. Its links
    # point at compare/commit URLs that only resolve once the tag is published,
    # and it is never hand-edited, so a broken link here is not actionable.
    "CHANGELOG\\.md$",
]

############################# URL Exclusions ########################
# Regex patterns applied to link targets.
exclude = [
    "^mailto:",
    # Badge endpoints, aggressively rate-limited — a 429 is not a broken link.
    "img\\.shields\\.io",
    # Links this repository's own release tooling generates into notes and
    # changelogs. They 404 until the corresponding tag, commit or issue exists,
    # which by definition is after the link has been written.
    "github\\.com/nasimubd/skills/(compare|commit|issues)/",
]
